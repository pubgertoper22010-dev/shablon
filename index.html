<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Обзвон на администрацию</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;700&display=swap">
<style>
:root{--bg:#f3f5f9;--surface:#fff;--ink:#1b2230;--muted:#5d677a;--line:#d9deea;--accent:#2f5bea;--ok:#12805c;--bad:#c23a3a;--okbg:#e3f5ee;--badbg:#fbe9e9;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#11151e;--surface:#1a202c;--ink:#e7ebf4;--muted:#9aa5bb;--line:#2b3446;--accent:#7b9bff;--ok:#4cd1a0;--bad:#ff8585;--okbg:#14352b;--badbg:#3b1d1f}}
:root[data-theme="dark"]{--bg:#11151e;--surface:#1a202c;--ink:#e7ebf4;--muted:#9aa5bb;--line:#2b3446;--accent:#7b9bff;--ok:#4cd1a0;--bad:#ff8585;--okbg:#14352b;--badbg:#3b1d1f}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Onest,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:760px;margin:0 auto;padding:20px 16px 80px}
h1{font-size:1.6rem;margin:8px 0 4px}
h2{font-size:1.15rem;margin:32px 0 12px}
.lead{color:var(--muted);margin:0 0 20px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:520px){.fields{grid-template-columns:1fr}}
label{display:block;font-size:.85rem;color:var(--muted);margin-bottom:4px}
input{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px}
input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.bar{flex-wrap:wrap;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:10px 0;display:flex;gap:10px;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
.score{font-weight:700}
.score small{font-weight:400;color:var(--muted)}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 12px}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.q{background:var(--surface);border:1px solid var(--line);border-left-width:4px;border-radius:10px;padding:14px;margin-bottom:10px}
.q.ok{border-left-color:var(--ok)}.q.bad{border-left-color:var(--bad)}
.q-text{margin:0 0 10px;font-weight:500}
.q-text b{color:var(--muted);margin-right:6px}
.ans{display:none;background:var(--bg);border-radius:8px;padding:10px 12px;margin:0 0 10px;white-space:pre-line}
.q.open .ans{display:block}
.note{font-size:.9rem;color:var(--muted);margin:0 0 10px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row button.sel-ok{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.row button.sel-bad{background:var(--badbg);border-color:var(--bad);color:var(--bad)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
@media(prefers-reduced-motion:reduce){.toast{transition:none}}
.nav{display:none;position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));align-items:center;gap:10px;justify-content:space-between;z-index:6}
body.focus .nav{display:flex}
body.focus .q{display:none}body.focus .q.cur{display:block}body.focus h2{display:none}
body.focus .q-text{font-size:1.4rem;line-height:1.4}
body.focus .ans{font-size:1.15rem}
body.focus .row button{padding:14px 16px;flex:1}
.nav button{padding:12px 18px}
.nav-mid{text-align:center;font-size:.85rem;color:var(--muted);line-height:1.3}
summary{cursor:pointer;font-weight:700}
.tabs{display:flex;gap:8px;margin-bottom:8px}
.tabs a{padding:8px 14px;border:1px solid var(--line);border-radius:8px;color:var(--ink);text-decoration:none;background:var(--surface);font-weight:500}
.tabs a.on{background:var(--accent);border-color:var(--accent);color:#fff}
#picker button{min-width:42px;padding:6px 0;margin:0 4px 4px 0}
#picker .ok{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
#picker .bad{background:var(--badbg);border-color:var(--bad);color:var(--bad)}
#picker .cur{outline:2px solid var(--accent);outline-offset:1px}
.plabel{font-size:.8rem;color:var(--muted);margin:10px 0 4px}
#dl.ready{box-shadow:0 0 0 3px var(--okbg),0 0 0 5px var(--ok)}
</style>
</head>
<body>
<main>
<nav class="tabs"><a href="index.html" class="on">Обзвон 1</a><a href="obzvon2.html" class="">Обзвон 2</a></nav>
<h1>Обзвон на администрацию</h1>
<p class="lead">Задавайте вопросы по порядку, сверяйтесь с ответом и отмечайте результат кандидата.</p>

<details class="panel" open><summary>Анкета кандидата</summary>
<div class="fields" style="margin-top:12px">
<div><label for="f-name">Представьтесь</label><input id="f-name"></div>
<div><label for="f-nick">Никнейм</label><input id="f-nick"></div>
<div><label for="f-age">Возраст</label><input id="f-age" inputmode="numeric"></div>
<div><label for="f-tz">Часовой пояс</label><input id="f-tz"></div>
<div style="grid-column:1/-1"><label for="f-time">Сколько времени готовы уделять проекту?</label><input id="f-time"></div>
</div>
</details>

<div class="bar">
<div class="score" id="score">Верно 0 из 0 <small>отвечено 0 из 0</small></div>
<div class="row"><button id="mode">Режим опроса</button><button id="reset">Сбросить</button><button id="copy">Скопировать итог</button><button class="primary" id="dl">Скачать отчёт</button></div>
</div>

<details class="panel" id="pickd" style="margin:12px 0"><summary>Выбор вопроса</summary><div id="picker"></div></details>
<div id="list"></div>
<div class="nav" id="nav"><button id="prev">Назад</button><div class="nav-mid" id="navmid"></div><button class="primary" id="next">Далее</button></div>
</main>
<div class="toast" id="toast" role="status"></div>

<script>
var SECTIONS=[{t:"RolePlay термины",q:[
["Назовите RK в трёх видах.", "Убийство игрока с целью мести, возвращение на место смерти в течение 15 минут, повторное убийство одного и того же человека."],
["Что такое AFK?", "Полное бездействие игрока (обычно в момент его отсутствия от устройства, на котором открыта игра)."],
["Что такое LVL?", "Игровой уровень персонажа. В рамках RP обычно называют временем прописки в области (какой уровень — столько лет)."],
["Что такое TK?", "Убийство члена своей или союзной фракции, организации без наличия какой-либо IC причины."],
["Что такое ФФ / FF?", "Стрельба или нанесение урона по союзникам (без убийства)."]
]},
{t:"Правила выдачи наказаний",q:[
["Какое наказание за TK (убийство коллег)?", "Помещение в деморган на 15 минут."],
["Какое наказание за взлом или продажу аккаунта?", "Полная блокировка всех аккаунтов и бессрочная блокировка IP-адресов."],
["Какое наказание за использование запрещённых программ (читов)?", "Бан навсегда."],
["Какое наказание за рекламу других проектов или подозрительных ссылок?", "Внесение в чёрный список сервера, полное удаление всех аккаунтов и бессрочная блокировка IP-адресов."],
["Какое наказание за обман администрации и что грозит при повторном нарушении?", "Блокировка чата на 60 минут, повторное нарушение — бан навсегда."],
["Какое наказание за оскорбление родных?", "Ban на 7–14 дней."],
["Какое наказание за упоминание родных?", "Mute на 60–120 минут."],
["Какое наказание за DM?", "Jail на 60 минут."],
["Какое наказание за DB?", "Jail на 60 минут."],
["Какое наказание за CAPS?", "Mute на 30–60 минут."]
]},
{t:"Правила администрации",q:[
["Из чьего кармана администратор обязан выдавать приз победителю мероприятия и какой диапазон суммы приза?", "Из своего кармана; сумма от 10.000.000 до 20.000.000 (без права проводить мероприятие при отсутствии средств)."],
["Существует ли понятие «рабочий день» у администратора?", "Нет, обязанности выполняются вне зависимости от времени суток; с 21:00 при спокойной обстановке и отсутствии репортов можно отдохнуть, не нарушая основные правила."],
["Какое наказание за неуважительное и оскорбительное общение с игроками или с другой администрацией?", "Снятие с поста."],
["Какое наказание за некорректные ответы на репорты (например «не знаю», капс, транслит, нецензурная брань)?", "Выговор."],
["Разрешено ли администратору состоять в какой-либо фракции?", "Запрещено (выговор), кроме следящего администратора за данной фракцией."],
["Является ли администратор NonRP персонажем и имеет ли право вмешиваться в RP процессы игроков?", "Да, является NonRP персонажем и не имеет права вмешиваться в RP, кроме случаев нарушения игроками правил (обман, NRP поведение)."],
["Разрешено ли администратору менять игровой NickName?", "Запрещено вплоть до снятия, кроме случая с разрешения ГА."],
["Разрешено ли администратору участвовать или следить за мероприятиями, проводимыми администрацией?", "Запрещено, наказание — выговор."],
["Какой интервал между проведением мероприятий?", "30 минут после окончания предыдущего мероприятия."],
["Какое наказание следует за игнорирование репорта?", "Выговор."]
]}
];
var state={},list=document.getElementById("list"),total=0,n=0;
SECTIONS.forEach(function(s){
  var h=document.createElement("h2");h.textContent=s.t;list.appendChild(h);
  s.q.forEach(function(it){
    var id=++n;total++;
    var d=document.createElement("div");d.className="q";d.id="q"+id;d.dataset.sec=s.t;
    d.innerHTML='<p class="q-text"><b>'+id+'.</b></p><div class="ans"></div><div class="row"><button data-a="show">Показать ответ</button><button data-a="ok">Верно</button><button data-a="bad">Неверно</button></div>';
    d.querySelector(".q-text").appendChild(document.createTextNode(it[0]));
    var a=d.querySelector(".ans");a.textContent=it[1];
    if(it[2]){var p=document.createElement("p");p.className="note";p.style.marginTop="8px";p.style.marginBottom="0";p.textContent=it[2];a.appendChild(p);}
    d.addEventListener("click",function(e){
      var b=e.target.closest("button");if(!b)return;
      var act=b.dataset.a;
      if(act==="show"){d.classList.toggle("open");b.textContent=d.classList.contains("open")?"Скрыть ответ":"Показать ответ";return;}
      state[id]=(state[id]===act)?null:act;render();if(state[id]&&document.body.classList.contains("focus"))setTimeout(function(){go(1)},350);
    });
    list.appendChild(d);
  });
});
function render(){
  var ok=0,bad=0;
  for(var i=1;i<=total;i++){
    var d=document.getElementById("q"+i),v=state[i];
    d.classList.toggle("ok",v==="ok");d.classList.toggle("bad",v==="bad");
    var bs=d.querySelectorAll("button");
    bs[1].className=v==="ok"?"sel-ok":"";bs[2].className=v==="bad"?"sel-bad":"";
    if(v==="ok")ok++;if(v==="bad")bad++;
  }
  document.getElementById("score").innerHTML="Верно "+ok+" из "+total+" <small>отвечено "+(ok+bad)+" из "+total+"</small>";
}
function toast(t){var e=document.getElementById("toast");e.textContent=t;e.classList.add("on");setTimeout(function(){e.classList.remove("on")},1800);}
document.getElementById("reset").onclick=function(){
  state={};
  document.querySelectorAll("input").forEach(function(i){i.value="";});
  document.querySelectorAll(".q").forEach(function(q){q.classList.remove("open");q.querySelector("button").textContent="Показать ответ";});
  render();
};
document.getElementById("copy").onclick=function(){
  var v=function(i){return document.getElementById(i).value||"—";};
  var ok=0,wrong=[];
  for(var i=1;i<=total;i++){if(state[i]==="ok")ok++;else if(state[i]==="bad")wrong.push(i);}
  var t="Обзвон на администрацию\nИмя: "+v("f-name")+"\nНикнейм: "+v("f-nick")+"\nВозраст: "+v("f-age")+"\nЧасовой пояс: "+v("f-tz")+"\nГотов уделять времени: "+v("f-time")+"\nРезультат: "+ok+" из "+total+"\nОшибки в вопросах: "+(wrong.length?wrong.join(", "):"нет");
  function done(){toast("Итог скопирован");}
  try{navigator.clipboard.writeText(t).then(done,function(){fallback(t);});}catch(e){fallback(t);}
};
function fallback(t){var a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();try{document.execCommand("copy");toast("Итог скопирован");}catch(e){toast("Не удалось скопировать");}a.remove();}
var cur=1;
function showCur(){
  for(var i=1;i<=total;i++)document.getElementById("q"+i).classList.toggle("cur",i===cur);
  var q=document.getElementById("q"+cur);
  document.getElementById("navmid").innerHTML="Вопрос "+cur+" из "+total+"<br>"+q.dataset.sec;
  document.getElementById("prev").disabled=cur===1;
  document.getElementById("next").disabled=cur===total;
  window.scrollTo(0,0);
}
function go(d){cur=Math.max(1,Math.min(total,cur+d));showCur();updatePicker();}
document.getElementById("prev").onclick=function(){go(-1);};
document.getElementById("next").onclick=function(){go(1);};
document.getElementById("mode").onclick=function(){
  var on=document.body.classList.toggle("focus");
  this.textContent=on?"Все вопросы":"Режим опроса";
  document.querySelector("details.panel").open=!on;
  if(on)showCur();
};
document.addEventListener("keydown",function(e){
  if(!document.body.classList.contains("focus")||/INPUT|TEXTAREA/.test(e.target.tagName))return;
  var bs=document.getElementById("q"+cur).querySelectorAll("button");
  if(e.key==="ArrowRight")go(1);
  else if(e.key==="ArrowLeft")go(-1);
  else if(e.key===" "){e.preventDefault();bs[0].click();}
  else if(e.key==="1")bs[1].click();
  else if(e.key==="2")bs[2].click();
});
function buildReport(){
  var v=function(i){return document.getElementById(i).value||"—";};
  var now=new Date(),ok=0,bad=0,skip=0,lines=[],id=0;
  SECTIONS.forEach(function(sec){
    lines.push("","== "+sec.t+" ==");
    sec.q.forEach(function(it){
      id++;
      var st=state[id]==="ok"?"ВЕРНО":state[id]==="bad"?"НЕВЕРНО":"НЕ ЗАДАН";
      if(state[id]==="ok")ok++;else if(state[id]==="bad")bad++;else skip++;
      lines.push(id+". "+it[0],"   Эталонный ответ: "+it[1].replace(/\n/g,"; "),"   Результат: "+st);
    });
  });
  var pct=total?Math.round(ok/total*100):0;
  return ["ОТЧЁТ ПО ОБЗВОНУ НА АДМИНИСТРАЦИЮ","Дата: "+now.toLocaleString("ru-RU"),"",
    "Имя: "+v("f-name"),"Никнейм: "+v("f-nick"),"Возраст: "+v("f-age"),"Часовой пояс: "+v("f-tz"),"Готов уделять времени: "+v("f-time"),"",
    "ИТОГ: верно "+ok+" из "+total+" ("+pct+"%), неверно "+bad+", не задано "+skip].concat(lines).join("\r\n");
}
document.getElementById("dl").onclick=function(){
  try{
    var nick=(document.getElementById("f-nick").value||"kandidat").replace(/[^\wА-Яа-яЁё-]+/g,"_");
    var d=new Date(),ds=d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2);
    var blob=new Blob(["\ufeff"+buildReport()],{type:"text/plain;charset=utf-8"});
    var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="otchet_"+nick+"_"+ds+".txt";
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(function(){URL.revokeObjectURL(a.href);},1000);
    toast("Отчёт скачан");
  }catch(e){toast("Не удалось создать файл");}
};
var pk=document.getElementById("picker"),pbtn=[],pid=0;
SECTIONS.forEach(function(sec){
  var l=document.createElement("div");l.className="plabel";l.textContent=sec.t;pk.appendChild(l);
  sec.q.forEach(function(){
    var i=++pid,b=document.createElement("button");b.textContent=i;
    b.onclick=function(){
      cur=i;
      if(document.body.classList.contains("focus"))showCur();
      else document.getElementById("q"+i).scrollIntoView({behavior:"smooth",block:"center"});
      updatePicker();
    };
    pk.appendChild(b);pbtn[i]=b;
  });
});
function updatePicker(){
  for(var i=1;i<=total;i++){var c=state[i]||"";if(i===cur)c+=" cur";pbtn[i].className=c;}
}
var _render=render,notified=false;
render=function(){
  _render();updatePicker();
  var done=0;for(var i=1;i<=total;i++)if(state[i])done++;
  var btn=document.getElementById("dl");
  btn.classList.toggle("ready",done===total);
  if(done===total&&!notified){notified=true;toast("Все вопросы отвечены — скачайте отчёт");}
  if(done<total)notified=false;
};
render();
</script>
</body>
</html>
